name: osm-map-quality-env
version: "2.0.0"
description: >
  A real-world OpenStreetMap (OSM) data quality checking environment.
  An AI agent inspects map feature records and fixes data quality issues
  such as missing tags, invalid coordinates, and conflicting attributes.
author: dokka vijay
email: helloaavijay@gmail.com

environment:
  type: http
  port: 7860

action:
  type: object
  fields:
    action_type:
      type: string
      enum: [set_tag, remove_tag, fix_coordinates, merge_duplicate, flag_invalid, mark_complete]
    tag_key:
      type: string
      required: false
    tag_value:
      type: string
      required: false
    coordinates:
      type: object
      required: false
      fields:
        lat: {type: number}
        lon: {type: number}
    confidence:
      type: number
      required: false

observation:
  type: object
  fields:
    feature_id: {type: string}
    feature_type: {type: string}
    current_tags: {type: object}
    secondary_feature: {type: object, required: false}
    issues_remaining: {type: integer}
    feedback: {type: string}
    reward: {type: number}
    done: {type: boolean}
    task_id: {type: string}
    step_count: {type: integer}

tasks:
  - id: task_easy
    description: Fix missing name tag on a cafe feature in Hyderabad
    max_steps: 10
  - id: task_medium
    description: Fill in missing address fields (street, city, postcode, country) for a shop
    max_steps: 20
  - id: task_hard
    description: Fix multiple issues on a hospital feature including name, coordinates, address, and duplicate
    max_steps: 30

endpoints:
  reset: POST /reset
  step: POST /step
  state: GET /state
  tasks: GET /tasks
  grader: POST /grader
  baseline: POST /baseline
  predict: POST /predict
  health: GET /health

tags:
  - openenv

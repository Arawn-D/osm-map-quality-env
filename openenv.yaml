name: osm-map-quality-env
version: "2.1.0"
description: >
  A world-modeling environment for geographic data quality assurance.
  Features partial observability, noisy/conflicting inputs, cascading 
  error discovery, confidence-calibrated grading, and dynamic task generation.
  Agents must reason under uncertainty to fix real-world OpenStreetMap data — 
  the way human mappers actually work.
author: dokka vijay
email: helloaavijay@gmail.com
environment:
  type: http
  port: 7860
innovations:
  - partial_observability: "Tags revealed progressively through agent actions"
  - noisy_data: "Typos, conflicting values, stale data injected dynamically"
  - cascading_errors: "Fixing one issue may reveal new inconsistencies"
  - confidence_calibration: "Overconfident wrong actions penalized more heavily"
  - dynamic_generation: "Fresh task variations each episode via randomized seeds"
  - multi_dimensional_grading: "6-axis scoring: completeness, consistency, efficiency, accuracy, merge quality, sequence"
action:
  type: object
  fields:
    action_type:
      type: string
      enum: [set_tag, remove_tag, fix_coordinates, merge_duplicate, flag_invalid, mark_complete]
    tag_key:
      type: string
      required: false
    tag_value:
      type: string
      required: false
    coordinates:
      type: object
      required: false
    confidence:
      type: number
      description: "Agent's confidence in this action (0.0-1.0). Affects reward calibration."
observation:
  type: object
  description: "Partially observable — not all tags visible at start. Actions reveal data."
  fields:
    feature_id: {type: string}
    feature_type: {type: string}
    current_tags: {type: object, note: "Only visible tags shown. More revealed through actions."}
    issues_remaining: {type: integer}
    feedback: {type: string, note: "Includes diagnostic hints and cascading discovery alerts."}
    reward: {type: number}
    done: {type: boolean}
    task_id: {type: string}
    step_count: {type: integer}
tasks:
  - id: task_easy
    name: Missing Name Tag Fix
    difficulty: easy
    max_steps: 10
    score_range: [0.05, 0.95]
    features: [dynamic_generation, noise_injection]
  - id: task_medium
    name: Multi-Field Address Completion
    difficulty: medium
    max_steps: 20
    score_range: [0.05, 0.95]
    features: [conflicting_data, noise_injection, dynamic_generation]
  - id: task_hard
    name: Duplicate & Conflicting Feature Resolution
    difficulty: hard
    max_steps: 30
    score_range: [0.05, 0.95]
    features: [partial_observability, cascading_errors, conflicting_data, noise_injection, dynamic_generation]
endpoints:
  step: POST /step
  reset: POST /reset
  state: GET /state
  tasks: GET /tasks
  grader: POST /grader
  baseline: POST /baseline
  health: GET /health
  info: GET /info
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osm-map-quality-env"
version = "1.0.0"
description = "Real-world OSM map quality agent environment for OpenEnv hackathon"
authors = [{name = "dokka vijay", email = "helloaavijay@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "requests>=2.28.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.main:app"

[tool.openenv]
env_class = "server.environment:OSMMapQualityEnvironment"
env_id = "osm-map-quality-env"
version = "1.0.0"

[tool.hatch.build.targets.wheel]
packages = ["server"]
